<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Question Section -->
        <div class="question-container">
            <div class="gif-container">
                <img id="panda-gif" src="https://i.giphy.com/media/LNbc2cG6PKivrJsaIx/giphy.gif" alt="Cute Panda GIF">
            </div>
            <h2>Do you love me?</h2>
            <p class="subtitle">My heart has a secret question for you...</p>
            
            <div class="btn-group">
                <button class="yes-btn">Yes!</button>
                <button class="no-btn">No</button>
            </div>
        </div>

        <!-- Result Section (Hidden Initially, Romantic Background) -->
        <div class="result-container" style="display: none; background: linear-gradient(135deg, #520909, #120308);">
            <div class="gif-container">
                <!-- Cute Panda Kiss GIF set here -->
                <img src="https://i.giphy.com/media/3o7TKWpu2WCovaH0cw/giphy.gif" alt="Love Cartoon GIF">
            </div>
            <h2>I knew it! ❤️</h2>
            <p class="subtitle">You just made my heart beat a million times faster!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
