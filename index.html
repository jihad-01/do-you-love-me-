<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="question-container">
            <div class="gif-container">
                <img id="panda-gif" src="https://media.giphy.com/media/3o7bu3XilJ5BOiSGic/giphy.gif" alt="Cute Panda GIF">
            </div>
            <h2>Do you love me?</h2>
            <p class="subtitle">My heart has a secret question for you...</p>
            
            <div class="btn-group">
                <button class="yes-btn">Yes!</button>
                <button class="no-btn">No</button>
            </div>
        </div>

        <div class="result-container" style="display: none;">
            <div class="gif-container">
                <img src="https://media.giphy.com/media/3o6ZtaO9BZHcOjmErm/giphy.gif" alt="Cute Couple Kiss GIF">
            </div>
            <h2>I knew it! ❤️</h2>
            <p class="subtitle">You just made my heart beat a million times faster!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
