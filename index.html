<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do You Love Me?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Floating hearts container -->
  <div class="hearts-container" id="heartsContainer" aria-hidden="true"></div>

  <main class="card" id="card">
    <!-- Question State -->
    <div class="question-state" id="questionState">
      <h1 class="question-title">Do you love me?</h1>
      <p class="subtitle">My heart has a secret question for you...</p>

      <div class="buttons">
        <button class="btn btn-yes" id="yesBtn">Yes!</button>
        <button class="btn btn-no" id="noBtn">No</button>
      </div>
    </div>

    <!-- Success State (hidden by default) -->
    <div class="success-state" id="successState">
      <h1 class="success-title">I knew it! ❤️</h1>
      <p class="success-subtitle">You’re the first love of my life—the one and only person in the whole world!</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
